function runC(s){say('> '+s);const a=s.trim().split(/\s+/),f=CMD[a.shift().toLowerCase()];try{f?f(a):say('unknown command - try help')}catch(e){say('error: '+e.message)}}
function tcon(){con=!con;cn.style.display=con?'block':'none';if(con)cn.focus();else cn.blur()}
cn.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'&&cn.value.trim()){runC(cn.value);cn.value=''}else if(e.key==='Escape'||e.key==='`'){e.preventDefault();tcon()}});
// ---- input
const start=i=>{load(i);st='play';started=1};
addEventListener('keydown',e=>{if(con)return;const k=e.key.toLowerCase();K[k]=1;if([' ','arrowup','arrowdown'].includes(k))e.preventDefault();
 if(k==='`'||k==='f1'){e.preventDefault();tcon();return}
 if(st==='menu'){if(k==='arrowleft'||k==='a')sel=(sel+3)%4;else if(k==='arrowright'||k==='d')sel=(sel+1)%4;else if(k==='enter'||k===' ')start(sel);else if(k==='escape'&&started)st='play';return}
 if(k==='m'||k==='escape')st='menu';else if(k==='r')reload();else if(k===' '||k==='w'||k==='arrowup')jb=.12;else if(k==='enter'&&P.hp<=0)load(MAPS.indexOf(M))});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=0});
addEventListener('contextmenu',e=>e.preventDefault());
const ptr={};
function lp(e){const r=c.getBoundingClientRect();return[((e.clientX-r.left)*dpr-OX)/S,((e.clientY-r.top)*dpr-OY)/S]}
c.addEventListener('pointerdown',e=>{const[X,Y]=lp(e);c.setPointerCapture(e.pointerId);
 const b=(touch||e.pointerType==='touch')?BT.find(b=>X>=b[2]&&X<=b[2]+b[4]&&Y>=b[3]&&Y<=b[3]+b[5]):null;
 if(b&&!(st==='menu'&&b[0]!=='cs')){ptr[e.pointerId]=b[0];B[b[0]]=1;const k=b[0];if(k==='f')shoot();else if(k==='s')tog=!tog;else if(k==='rl')reload();else if(k==='m')st='menu';else if(k==='cs')tcon();return}
 if(st==='menu'){MAPS.forEach((m,i)=>{const[a,b2,w,h]=cr(i);if(X>=a&&X<=a+w&&Y>=b2&&Y<=b2+h)start(i)});return}
 if(P.hp<=0){load(MAPS.indexOf(M));return}
 mx=X;my=Y;ptr[e.pointerId]='aim';if(e.pointerType==='mouse'){if(e.button===2)rmb=1;else shoot()}});
c.addEventListener('pointermove',e=>{const[X,Y]=lp(e);if(e.pointerType==='mouse'||ptr[e.pointerId]==='aim'){mx=X;my=Y;if(st==='menu')MAPS.forEach((m,i)=>{const[a,b,w,h]=cr(i);if(X>=a&&X<=a+w&&Y>=b&&Y<=b+h)sel=i})}});
const up=e=>{const k=ptr[e.pointerId];if(k&&k!=='aim')B[k]=0;if(e.pointerType==='mouse')rmb=0;delete ptr[e.pointerId]};
c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
M=MAPS[0];P={x:0,y:0,hp:100,mag:5,res:30,cd:0,rl:0};E=[];
let last=performance.now();
(function loop(t){const dt=Math.min((t-last)/1e3,.05);last=t;if(st==='play'){if(!con)upd(dt*cfg.ts);draw()}else menu();requestAnimationFrame(loop)})(last);
</script></body></html>
